<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  
  <!-- Background with smooth rounded edges -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle border accent -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#fav-grad)" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Monogram text AV -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="26" font-weight="800" fill="url(#fav-grad)" text-anchor="middle" letter-spacing="-1">AV</text>
</svg>
